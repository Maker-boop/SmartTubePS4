name: Build SmartTube PS4 v2.9 PKG
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - "Makefile"
      - "pkg.gp4"
      - "native/**"
      - "sce_sys/**"
      - ".github/workflows/build.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Checkout OpenOrbis create-fself v1.3
        uses: actions/checkout@v4
        with:
          repository: OpenOrbis/create-fself
          ref: v1.3
          path: .tools/create-fself-src

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Build create-fself
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tools
          cd .tools/create-fself-src/cmd/create-fself
          CGO_ENABLED=0 go build -o ../../../create-fself -modfile=go-linux.mod
          test -x ../../../create-fself
      - name: Build with OpenOrbis toolchain container
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --user 0:0 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            openorbisofficial/toolchain:latest \
            bash -lc 'make clean && make'
      - name: Verify package output
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=( *.pkg )
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "No PKG file was produced."
            exit 1
          fi
          ls -lh "${packages[@]}"
          test -s eboot.bin
          test -s pkg.gp4
      - name: Upload PKG artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartTubePS4-v2.9-PKG
          if-no-files-found: error
          path: |
            *.pkg
            eboot.bin
            pkg.gp4
            build/smarttube_ps4.elf

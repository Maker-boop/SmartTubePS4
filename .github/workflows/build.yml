name: Build SmartTube PS4 v2.9 PKG
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - "Makefile"
      - "pkg.gp4"
      - "native/**"
      - "sce_sys/**"
      - ".github/workflows/build.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Build with OpenOrbis toolchain container
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --user 0:0 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            openorbisofficial/toolchain:latest \
            bash -lc '
            set -e
            echo "OpenOrbis packaging tools:"
            ls -1 "$OO_PS4_TOOLCHAIN/bin/linux" | grep -E "create|PkgTool" || true
            echo "OpenOrbis SDL2 sample packaging recipe:"
            grep -n "create-" "$OO_PS4_TOOLCHAIN/samples/SDL2/Makefile" || true
            cp -a "$OO_PS4_TOOLCHAIN/samples/SDL2" /tmp/openorbis-sdl2-reference
            (cd /tmp/openorbis-sdl2-reference && make clean && make)
            cd /workspace
            make clean && make
          '
      - name: Verify package output
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=( *.pkg )
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "No PKG file was produced."
            exit 1
          fi
          ls -lh "${packages[@]}"
          test -s eboot.bin
          test -s pkg.gp4
      - name: Upload PKG artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartTubePS4-v2.9-PKG
          if-no-files-found: error
          path: |
            *.pkg
            eboot.bin
            pkg.gp4
            build/smarttube_ps4.elf
